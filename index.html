<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Norte</title>
  <meta name="description" content="Norte — Apenas, faça. Um sistema pessoal para organizar o que importa, executar e acompanhar seu progresso.">
  <meta name="theme-color" content="#F4F3EF">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/views.css">
  <script>
    // Aplica o tema salvo antes da primeira pintura (evita "piscar" claro/escuro).
    try {
      var t = localStorage.getItem('norte-theme') || localStorage.getItem('af-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <button type="button" class="skip-link" onclick="document.getElementById('main').focus()">Pular para o conteúdo</button>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <header id="topbar" class="topbar"></header>
    <main id="main" class="main" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar"></nav>
  </div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <noscript>
    <p style="padding:24px;font-family:sans-serif">O Norte precisa de JavaScript ativado para funcionar.</p>
  </noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
